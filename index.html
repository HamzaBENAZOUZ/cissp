<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CISSP // Training Terminal</title>
  <meta name="description" content="Entraînement QCM CISSP par chapitre (Official Study Guide, 10e édition).">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#0a1112">
  <link rel="preload" href="assets/fonts/montserrat.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Applique le thème avant l'affichage (évite un flash).
    (function () {
      var th = null;
      try { th = localStorage.getItem("cissp-theme"); } catch (e) {}
      if (th !== "light" && th !== "dark") th = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = th;
    })();
  </script>
</head>
<body>
  <canvas id="matrix" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="topbar">
    <a href="#/" class="brand" data-nav="home">
      <span class="brand-logo"><img src="assets/logo-cissp.png" alt="CISSP" width="40" height="37"></span>
      <span class="brand-text">CISSP <span class="accent">Training</span></span>
    </a>
    <div class="topbar-right">
      <span id="mode-badge" class="badge"></span>
      <div class="seg" role="group" aria-label="Langue / Language">
        <button class="seg-btn mono" data-lang="fr" aria-pressed="false">FR</button>
        <button class="seg-btn mono" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button id="btn-theme" class="icon-btn" aria-pressed="false">
        <svg class="ico-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
      <span id="user-label" class="user-label"></span>
      <button id="btn-logout" class="btn btn-ghost btn-sm" hidden>Déconnexion</button>
    </div>
  </header>

  <main id="app" class="container">
    <div class="boot">
      <p class="mono">&gt; boot<span class="cursor">_</span></p>
    </div>
  </main>

  <footer class="footer mono">
    <span id="footer-src"></span>
    <span id="footer-keys"></span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/matrix.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
